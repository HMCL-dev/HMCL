launch.failed.execution_policy=Ausführungsrichtlinie festlegen
launch.failed.execution_policy.failed_to_set=Fehler beim Festlegen der Ausführungsrichtlinie
launch.failed.execution_policy.hint=Die aktuelle Ausführungsrichtlinie verhindert die Ausführung von PowerShell-Skripten.\n\nKlicken Sie auf "OK", um dem aktuellen Benutzer die Ausführung von PowerShell-Skripten zu erlauben, oder klicken Sie auf "Abbrechen", um sie beizubehalten.
launch.failed.exited_abnormally=Spiel abgestürzt. Bitte beachten Sie das Absturzprotokoll für weitere Details.
launch.failed.java_version_too_low=Die von Ihnen angegebene Java-Version ist zu niedrig. Bitte setzen Sie die Java-Version zurück.
launch.failed.no_accepted_java=Es konnte keine kompatible Java-Version gefunden werden. Möchten Sie das Spiel mit der Standard-Java-Version starten?\nKlicken Sie auf "Ja", um das Spiel mit der Standard-Java-Version zu starten.\nOder navigieren Sie zu "Globale/Instanzspezifische Einstellungen → Java", um selbst eine auszuwählen.
