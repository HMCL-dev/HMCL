launch.advice=%s Möchten Sie den Start dennoch fortsetzen?
launch.advice.multi=Die folgenden Probleme wurden erkannt:\n\n%s\n\nDiese Probleme können Sie daran hindern, das Spiel zu starten oder das Spielerlebnis beeinträchtigen.\nMöchten Sie den Start dennoch fortsetzen?
launch.advice.java.auto=Die aktuelle Java-Version ist nicht mit der Instanz kompatibel.\n\nKlicken Sie auf "Ja", um automatisch die am besten kompatible Java-Version auszuwählen. Oder Sie können zu "Allgemeine/Instanzspezifische Einstellungen → Java" navigieren, um selbst eine auszuwählen.
launch.advice.java.modded_java_7=Minecraft 1.7.2 und frühere Versionen benötigen Java 7 oder früher.
launch.advice.cleanroom=Cleanroom %2$s kann nur auf Java %1$s oder neuer ausgeführt werden. Bitte verwenden Sie Java %1$s oder neuere Versionen.
launch.advice.corrected=Wir haben das Java-Problem behoben. Wenn Sie weiterhin Ihre ausgewählte Java-Version verwenden möchten, können Sie "JVM-Kompatibilität nicht prüfen" unter "Allgemeine/Instanzspezifische Einstellungen → Erweiterte Einstellungen" deaktivieren.
launch.advice.uncorrected=Wenn Sie weiterhin Ihre ausgewählte Java-Version verwenden möchten, können Sie "JVM-Kompatibilität nicht prüfen" unter "Allgemeine/Instanzspezifische Einstellungen → Erweiterte Einstellungen" deaktivieren.
launch.advice.different_platform=Die 64-Bit-Java-Version wird für Ihr Gerät empfohlen, Sie haben jedoch eine 32-Bit-Version installiert.
launch.advice.forge2760_liteloader=Forge Version 2760 ist nicht mit LiteLoader kompatibel. Bitte ziehen Sie ein Upgrade von Forge auf Version 2773 oder neuer in Betracht.
launch.advice.forge28_2_2_optifine=Forge Version 28.2.2 oder neuer ist nicht mit OptiFine kompatibel. Bitte ziehen Sie ein Downgrade von Forge auf Version 28.2.1 oder früher in Betracht.
launch.advice.forge37_0_60=Forge-Versionen vor 37.0.60 sind nicht mit Java 17 kompatibel. Bitte aktualisieren Sie Forge auf 37.0.60 oder neuer, oder starten Sie das Spiel mit Java 16.
launch.advice.java8_1_13=Minecraft 1.13 und neuer kann nur auf Java 8 oder neuer ausgeführt werden. Bitte verwenden Sie Java 8 oder neuere Versionen.
launch.advice.java8_51_1_13=Minecraft 1.13 kann auf Java 8-Versionen vor 1.8.0_51 abstürzen. Bitte installieren Sie die neueste Java 8-Version.
launch.advice.java9=Sie können Minecraft 1.12 oder früher nicht mit Java 9 oder neuer starten. Bitte verwenden Sie stattdessen Java 8.
launch.advice.lwjgl_3_4_1=Die aktuelle Spielversion hat ein bekanntes Problem, das zu Ruckeln im Spiel führen kann.\nHMCL kann die Spielleistung automatisch optimieren (mittels eines Java-Agenten).\nErlauben Sie HMCL, das Spiel automatisch zu optimieren?\nWenn Probleme auftreten, können Sie die Option "HMCL erlauben, das Spiel zu modifizieren" unter "Einstellungen → Allgemein" deaktivieren.
launch.advice.lwjgl_3_4_1.title=HMCL erlauben, das Spiel automatisch zu optimieren?
launch.advice.modded_java=Einige Mods sind möglicherweise nicht mit neueren Java-Versionen kompatibel. Es wird empfohlen, Java %1$s zu verwenden, um Minecraft %2$s zu starten.
launch.advice.modlauncher8=Die Forge-Version, die Sie verwenden, ist nicht mit der aktuellen Java-Version kompatibel. Bitte versuchen Sie, Forge zu aktualisieren.
launch.advice.newer_java=Sie verwenden eine ältere Java-Version, um das Spiel zu starten. Es wird empfohlen, auf Java 8 zu aktualisieren, da sonst einige Mods das Spiel zum Absturz bringen können.
launch.advice.not_enough_space=Sie haben eine Speichergröße zugewiesen, die größer ist als die tatsächlich auf Ihrem Computer installierten %d MiB Speicher. Es kann zu Leistungseinbußen kommen oder das Spiel kann sogar nicht gestartet werden.
launch.advice.require_newer_java_version=Die aktuelle Spielversion erfordert Java %s, aber wir konnten keine finden. Möchten Sie jetzt eine herunterladen?
launch.advice.too_large_memory_for_32bit=Sie haben eine Speichergröße zugewiesen, die das Speicherlimit der 32-Bit-Java-Installation überschreitet. Sie können das Spiel möglicherweise nicht starten.
launch.advice.vanilla_linux_java_8=Minecraft 1.12.2 oder früher unterstützt nur Java 8 für die Linux-x86-64-Plattform, da die späteren Versionen keine 32-Bit-nativen Bibliotheken wie liblwjgl.so laden können\n\nBitte laden Sie es von java.com herunter oder installieren Sie OpenJDK 8.
launch.advice.vanilla_x86.translation=Minecraft wird auf Ihrer Plattform nicht vollständig unterstützt, daher fehlen möglicherweise Funktionen oder Sie können das Spiel sogar nicht starten.\nSie können Java für die <b>x86-64</b>-Architektur <a href="https://learn.microsoft.com/java/openjdk/download">hier</a> herunterladen, um ein vollständiges Spielerlebnis zu erhalten.
launch.advice.unknown=Das Spiel kann aus folgenden Gründen nicht gestartet werden:
launch.failed=Start fehlgeschlagen
launch.failed.cannot_create_jvm=Wir können keine JVM erstellen. Es kann durch falsche JVM-Argumente verursacht werden. Sie können versuchen, das Problem zu beheben, indem Sie alle Argumente entfernen, die Sie unter "Allgemeine/Instanzspezifische Einstellungen → Erweiterte Einstellungen → JVM-Optionen" hinzugefügt haben.
launch.failed.creating_process=Wir können keinen neuen Prozess erstellen. Bitte überprüfen Sie Ihren Java-Pfad.\n
launch.failed.command_too_long=Die Befehlslänge überschreitet die maximale Länge eines Batch-Skripts. Bitte versuchen Sie, es als PowerShell-Skript zu exportieren.
launch.failed.decompressing_natives=Fehler beim Entpacken nativer Bibliotheken.\n
launch.failed.download_library=Fehler beim Herunterladen der Bibliotheken "%s".
