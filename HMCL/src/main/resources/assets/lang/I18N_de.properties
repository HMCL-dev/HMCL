download.javafx.notes=Wir laden derzeit Abhängigkeiten für HMCL aus dem Internet herunter.\n\
   \n\
   Sie können auf "Download-Quelle ändern" klicken, um die Download-Quelle auszuwählen, oder\nauf "Abbrechen" klicken, um den Vorgang abzubrechen und zu beenden.\n\
   Hinweis: Wenn Ihre Download-Geschwindigkeit zu langsam ist, können Sie versuchen, zu einem anderen Spiegelserver zu wechseln.
