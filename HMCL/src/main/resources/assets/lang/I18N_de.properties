terracotta.confirm.title=Benutzerhinweis
terracotta.confirm.desc=Terracotta ist eine kostenlose Open-Source-Software von Drittanbietern. Bitte geben Sie während der Nutzung über die entsprechenden Kanäle Feedback zu aufgetretenen Problemen.\n\
  Terracotta verwendet P2P-Technologie. Nach einer erfolgreichen Verbindung verbinden sich die Benutzer im Raum direkt miteinander, und kein Server von Drittanbietern leitet Ihren Datenverkehr weiter. Das endgültige Mehrspieler-Erlebnis hängt stark von den Netzwerkbedingungen der Teilnehmer ab.\n\
  Während des gesamten Mehrspieler-Vorgangs müssen Sie alle Gesetze und Vorschriften Ihres Landes und Ihrer Region strikt einhalten.
