fatal.create_hmcl_current_directory_failure=Hello Minecraft! Launcher kann das HMCL-Verzeichnis (%s) nicht erstellen. Bitte verschieben Sie HMCL an einen anderen Speicherort und öffnen Sie es erneut.
fatal.javafx.incomplete=Die JavaFX-Umgebung ist unvollständig.\n\
   Bitte versuchen Sie, Ihr Java zu ersetzen oder OpenJFX neu zu installieren.
fatal.javafx.missing=Fehlende JavaFX-Umgebung. Bitte öffnen Sie den Hello Minecraft! Launcher mit Java, welches OpenJFX enthält.
fatal.config_change_owner_root=Sie verwenden das Root-Konto, um den Hello Minecraft! Launcher zu öffnen. Dies könnte Sie daran hindern, HMCL in Zukunft mit einem anderen Konto zu öffnen.\n\
   Möchten Sie trotzdem fortfahren?
fatal.config_in_temp_dir=Sie öffnen den Hello Minecraft! Launcher in einem temporären Verzeichnis. Ihre Einstellungen und Spieldaten könnten verloren gehen.\n\
   Es wird empfohlen, HMCL an einen anderen Ort zu verschieben und erneut zu öffnen.\n\
   Möchten Sie trotzdem fortfahren?
fatal.config_loading_failure=Konfigurationsdateien können nicht geladen werden.\n\
   Bitte stellen Sie sicher, dass der Hello Minecraft! Launcher Lese- und Schreibzugriff auf "%s" und die darin enthaltenen Dateien hat.\n\
   Versuchen Sie unter macOS, HMCL an einen Ort mit anderen Berechtigungen als "Schreibtisch", "Downloads" und "Dokumente" zu legen und versuchen Sie es erneut.
fatal.config_loading_failure.unix=Hello Minecraft! Launcher konnte die Konfigurationsdatei nicht laden, da sie vom Benutzer "%1$s" erstellt wurde.\n\
   Bitte öffnen Sie HMCL als Root-Benutzer (nicht empfohlen) oder führen Sie den folgenden Befehl im Terminal aus, um den Besitz der Konfigurationsdatei auf den aktuellen Benutzer zu übertragen:\n%2$s
fatal.config_unsupported_version=Die aktuelle Konfigurationsdatei wurde von einer neueren Version des Hello Minecraft! Launchers erstellt, und diese Version von HMCL kann sie nicht richtig laden.\n\
   Bitte aktualisieren Sie HMCL und starten Sie es neu.\n\
   Vor dem Aktualisieren des Launchers werden keine von Ihnen geänderten Einstellungen gespeichert.
fatal.mac_app_translocation=Hello Minecraft! Launcher wurde aufgrund von macOS-Sicherheitsmechanismen vom Betriebssystem in ein temporäres Verzeichnis isoliert.\n\
   Bitte verschieben Sie HMCL in ein anderes Verzeichnis, bevor Sie versuchen, es zu öffnen. Andernfalls könnten Ihre Einstellungen und Spieldaten nach einem Neustart verloren gehen.\n\
   Möchten Sie trotzdem fortfahren?
fatal.migration_requires_manual_reboot=Hello Minecraft! Launcher wurde aktualisiert. Bitte starten Sie den Launcher neu.
fatal.apply_update_failure=Es tut uns leid, aber der Hello Minecraft! Launcher kann nicht automatisch aktualisiert werden.\n\
   \n\
   Sie können manuell aktualisieren, indem Sie eine neuere Launcher-Version von %s herunterladen.\n\
   Wenn das Problem weiterhin besteht, melden Sie es uns bitte.
fatal.apply_update_need_win7=Der Hello Minecraft! Launcher kann unter Windows XP/Vista nicht automatisch aktualisiert werden.\n\
   \n\
   Sie können manuell aktualisieren, indem Sie eine neuere Launcher-Version von %s herunterladen.
fatal.deprecated_java_version=HMCL wird in Zukunft Java 17 oder neuer benötigen, um zu laufen, wird aber weiterhin das Starten von Spielen mit Java 6~16 unterstützen.\n\
\n\
Es wird empfohlen, die neueste Java-Version zu installieren, um sicherzustellen, dass HMCL ordnungsgemäß funktioniert.\n\
\n\
Sie können die alte Java-Version weiterhin behalten. HMCL kann mehrere Java-Versionen erkennen und verwalten und wählt basierend auf der Spielversion automatisch das entsprechende Java für Sie aus.
fatal.deprecated_java_version.update=HMCL wird in Zukunft Java 17 oder neuer benötigen, um zu laufen. Bitte installieren Sie die neueste Java-Version, um sicherzustellen, dass HMCL das Upgrade abschließen kann.\n\
\n\
Sie können die alte Java-Version weiterhin behalten.\
HMCL kann mehrere Java-Versionen erkennen und verwalten und wählt basierend auf der Spielversion automatisch das entsprechende Java für Sie aus.
fatal.deprecated_java_version.download_link=Java %d herunterladen
fatal.samba=Wenn Sie den Hello Minecraft! Launcher von einem Samba-Netzlaufwerk geöffnet haben, funktionieren einige Funktionen möglicherweise nicht. Bitte versuchen Sie, Ihr Java zu aktualisieren oder den Launcher in ein anderes Verzeichnis zu verschieben.
fatal.illegal_char=Ihr Arbeitsverzeichnis enthält ein ungültiges Zeichen "=". Sie können authlib-injector nicht verwenden oder den Skin Ihres Offline-Kontos nicht ändern.
fatal.unsupported_platform=Minecraft wird auf Ihrer Plattform noch nicht vollständig unterstützt, daher fehlen möglicherweise Funktionen oder Sie können das Spiel überhaupt nicht starten.\n\
   \n\
   Wenn Sie Minecraft 1.17 und neuer nicht starten können, können Sie versuchen, den "Renderer" unter "Allgemeine/Instanzspezifische Einstellungen → Grafikeinstellungen" auf "Mesa LLVMpipe" oder "Mesa Lavapipe" umzustellen, um CPU-Rendering für bessere Kompatibilität zu verwenden.
fatal.unsupported_platform.loongarch=Der Hello Minecraft! Launcher bietet nun Unterstützung für die Loongson-Plattform.\n\
   Wenn beim Spielen Probleme auftreten, können Sie https://docs.hmcl.net/groups.html für Hilfe besuchen.
fatal.unsupported_platform.windows_arm64=Der Hello Minecraft! Launcher bietet native Unterstützung für die Windows-on-Arm-Plattform. Wenn beim Spielen Probleme auftreten, versuchen Sie bitte, das Spiel mit Java basierend auf der x86-Architektur zu starten.\n\
   \n\
   Wenn Sie die <b>Qualcomm</b>-Plattform verwenden, müssen Sie möglicherweise das <a href="ms-windows-store://pdp/?productid=9NQPSL29BFFF">OpenGL-Kompatibilitätspaket</a> installieren, bevor Sie Spiele spielen.\n\
   Klicken Sie auf den Link, um zum Microsoft Store zu navigieren und das Kompatibilitätspaket zu installieren.
# When translating the following string into non-Latin languages, please retain the English translation
fatal.wine_warning=HMCL läuft unter Wine oder einer seiner Distributionen.\nAls plattformübergreifende Anwendung wird HMCL am besten nativ auf Ihrem Host-Betriebssystem ausgeführt.\nKlicken Sie auf "OK", um fortzufahren, aber beachten Sie bitte, dass einige Probleme auftreten können.

