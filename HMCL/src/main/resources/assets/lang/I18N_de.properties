exception.access_denied=HMCL kann nicht auf die Datei "%s" zugreifen. Sie wird möglicherweise von einem anderen Prozess blockiert.\n\
   \n\
   Windows-Benutzer können den "Ressourcenmonitor" öffnen, um zu überprüfen, ob ein anderer Prozess diese derzeit verwendet. Wenn dies der Fall ist, können Sie es nach Beendigung dieses Prozesses erneut versuchen.\n\
   Wenn nicht, überprüfen Sie bitte, ob Ihr Benutzerkonto über ausreichende Berechtigungen für den Zugriff verfügt.
exception.artifact_malformed=Die Integrität der heruntergeladenen Dateien kann nicht überprüft werden.
exception.ssl_handshake=Es konnte keine SSL-Verbindung hergestellt werden, da das SSL-Zertifikat in der aktuellen Java-Installation fehlt. Sie können versuchen, HMCL mit einer anderen Java-Installation zu öffnen und es erneut zu versuchen.
exception.dns.pollution=Es konnte keine SSL-Verbindung hergestellt werden. Die DNS-Auflösung könnte fehlerhaft sein. Bitte versuchen Sie, Ihren DNS-Server zu ändern oder einen Proxy-Dienst zu verwenden.

