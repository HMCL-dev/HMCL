update.channel.dev.hint=Sie verwenden derzeit einen Beta-Kanal-Build des Launchers. Obwohl er möglicherweise einige zusätzliche Funktionen enthält, ist er manchmal auch weniger stabil als die Builds des stabilen Kanals.\n\
   \n\
   Wenn Sie auf Fehler oder Probleme stoßen, geben Sie bitte Feedback über die auf der Seite <a href="hmcl://settings/feedback">Feedback</a> bereitgestellten Kanäle ab.\n\
   \n\
   Folgen Sie <a href="https://space.bilibili.com/1445341">@huanghongxun</a> auf Bilibili, um über wichtige HMCL-Neuigkeiten auf dem Laufenden zu bleiben, oder <a href="https://space.bilibili.com/20314891">@Glavo</a>, um mehr über den Entwicklungsfortschritt von HMCL zu erfahren.
