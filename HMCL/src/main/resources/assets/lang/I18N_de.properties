game=Spiele
game.crash.feedback=<b>Bitte teilen Sie keine Screenshots oder Fotos dieser Oberfläche mit anderen!</b> Wenn Sie andere um Hilfe bitten, klicken Sie bitte auf <b>"Absturzberichte exportieren"</b> und senden Sie die exportierte Datei zur Analyse an andere.
game.crash.info=Absturzinformationen
game.crash.reason=Absturzursache
game.crash.reason.analyzing=Analysiere...
game.crash.reason.multiple=Mehrere Ursachen erkannt:\n\n
game.crash.reason.block=Das Spiel ist aufgrund eines Blocks in der Welt abgestürzt.\n\
   \n\
   Sie können versuchen, diesen Block mit den <a href="https://minecraft.wiki/w/Tutorial:Programs_and_editors/Mapping#Map_editors">Karteneditoren</a> zu entfernen oder den Mod zu löschen, der ihn hinzugefügt hat.\n\
   \n\
   Blocktyp: %1$s\n\
   Ort: %2$s
game.crash.reason.bootstrap_failed=Das Spiel ist aufgrund des "%1$s" Mods abgestürzt.\n\
   \n\
   Sie können versuchen, ihn zu löschen oder zu aktualisieren.
game.crash.reason.config=Das Spiel ist abgestürzt, weil der Mod "%1$s" seine Konfigurationsdatei "%2$s" nicht analysieren konnte.
game.crash.reason.debug_crash=Das Spiel ist abgestürzt, weil Sie es manuell ausgelöst haben. Also wissen Sie wahrscheinlich, warum :)
game.crash.reason.duplicated_mod=Das Spiel kann aufgrund doppelter Mods "%1$s" nicht weiter ausgeführt werden.\n\
   \n\
   %2$s\n\
   \n\
   Jeder Mod kann nur einmal installiert werden. Bitte löschen Sie den doppelten Mod und versuchen Sie es erneut.
game.crash.reason.entity=Das Spiel ist aufgrund einer Entität in der Welt abgestürzt.\n\
   \n\
   Sie können versuchen, die Entität mit den <a href="https://minecraft.wiki/w/Tutorial:Programs_and_editors/Mapping#Map_editors">Karteneditoren</a> zu entfernen oder den Mod zu löschen, der sie hinzugefügt hat.\n\
   \n\
   Entitätstyp: %1$s\n\
   Ort: %2$s
game.crash.reason.modmixin_failure=Das Spiel ist abgestürzt, weil einige Mods nicht injiziert werden konnten.\n\
   \n\
   Dies bedeutet im Allgemeinen, dass der Mod einen Fehler hat oder nicht mit der aktuellen Umgebung kompatibel ist.\n\
   \n\
   Sie können das Protokoll überprüfen, um den fehlerhaften Mod zu finden.
game.crash.reason.forge_error=Forge/NeoForge hat möglicherweise Fehlerinformationen bereitgestellt.\n\
   \n\
   Sie können das Protokoll anzeigen und entsprechende Verarbeitungen gemäß den Protokollinformationen im Fehlerbericht vornehmen.\n\
   \n\
   Wenn Sie die Fehlermeldung nicht sehen, können Sie den Fehlerbericht anzeigen, um zu verstehen, wie der Fehler aufgetreten ist.\n\
   %1$s
game.crash.reason.mod_resolution0=Das Spiel ist aufgrund einiger Mod-Probleme abgestürzt. Sie können die Protokolle überprüfen, um den fehlerhaften Mod (die fehlerhaften Mods) zu finden.
game.crash.reason.mixin_apply_mod_failed=Das Spiel ist abgestürzt, weil das Mixin nicht auf den Mod "%1$s" angewendet werden konnte.\n\
   \n\
   Sie können versuchen, den Mod zu löschen oder zu aktualisieren, um das Problem zu beheben.
game.crash.reason.java_version_is_too_high=Das Spiel ist abgestürzt, weil die Java-Version zu neu ist, um weiter ausgeführt zu werden.\n\
   \n\
   Bitte verwenden Sie die vorherige Haupt-Java-Version unter "Allgemeine/Instanzspezifische Einstellungen → Java" und starten Sie dann das Spiel.\n\
   \n\
   Wenn nicht, können Sie es von <a href="https://www.java.com/download/">java.com (Java 8)</a> oder <a href="https://bell-sw.com/pages/downloads/#downloads">BellSoft Liberica Full JRE (Java 17)</a> und anderen Distributionen herunterladen und installieren (starten Sie den Launcher nach der Installation neu).
game.crash.reason.need_jdk11=Das Spiel ist aufgrund einer ungeeigneten Java-Version abgestürzt.\n\
   \n\
   Sie müssen Java 11 herunterladen und installieren und unter "Allgemeine/Instanzspezifische Einstellungen → Java" einstellen.
game.crash.reason.mod_name=Das Spiel ist aufgrund von Mod-Dateinamen-Problemen abgestürzt.\n\
   \n\
   Mod-Dateinamen sollten nur englische Buchstaben (A~Z, a~z), Zahlen (0~9), Bindestriche (-), Unterstriche (_) und Punkte (.) in halber Breite verwenden.\n\
   \n\
   Bitte navigieren Sie zum Mod-Verzeichnis und ändern Sie alle nicht konformen Mod-Dateinamen mit den oben genannten konformen Zeichen.
game.crash.reason.incomplete_forge_installation=Das Spiel kann aufgrund einer unvollständigen Forge/NeoForge-Installation nicht weiter ausgeführt werden.\n\
   \n\
   Bitte installieren Sie Forge/NeoForge unter "Instanz bearbeiten → Loader" neu.
game.crash.reason.fabric_version_0_12=Fabric Loader 0.12 oder neuer ist nicht mit den derzeit installierten Mods kompatibel. Sie müssen es auf 0.11.7 herunterstufen.
game.crash.reason.fabric_warnings=Der Fabric Loader hat gewarnt:\n\
   \n\
   %1$s
game.crash.reason.file_already_exists=Das Spiel ist abgestürzt, weil die Datei "%1$s" bereits existiert.\n\
   \n\
   Sie können versuchen, diese Datei zu sichern und zu löschen und das Spiel dann neu zu starten.
game.crash.reason.file_changed=Das Spiel ist abgestürzt, weil die Dateiüberprüfung fehlgeschlagen ist.\n\
   \n\
   Wenn Sie die Datei Minecraft.jar geändert haben, müssen Sie die Änderung rückgängig machen oder das Spiel erneut herunterladen.
game.crash.reason.gl_operation_failure=Das Spiel ist aufgrund einiger Mods, Shader oder Ressourcen-/Texturpakete abgestürzt.\n\
   \n\
   Bitte deaktivieren Sie die Mods, Shader oder Ressourcen-/Texturpakete, die Sie verwenden, und versuchen Sie es dann erneut.
game.crash.reason.graphics_driver=Das Spiel ist aufgrund eines Problems mit Ihrem Grafiktreiber abgestürzt.\n\
   \n\
   Bitte versuchen Sie es erneut, nachdem Sie Ihren Grafiktreiber auf die neueste Version aktualisiert haben.\n\
   \n\
   Wenn Ihr Computer über eine dedizierte Grafikkarte verfügt, müssen Sie überprüfen, ob das Spiel die integrierte/Kerngrafik verwendet. Wenn ja, öffnen Sie den Launcher bitte mit Ihrer dedizierten Grafikkarte. Wenn das Problem weiterhin besteht, sollten Sie wahrscheinlich in Betracht ziehen, eine neue Grafikkarte oder einen neuen Computer zu verwenden.\n\
   \n\
   Wenn Sie Ihre integrierte Grafikkarte verwenden, beachten Sie bitte, dass Minecraft 1.16.5 oder früher <a href="https://www.oracle.com/java/technologies/javase/javase8-archive-downloads.html">Java 1.8.0_51 oder früher</a> für Prozessoren der Intel(R) Core(TM) 3000-Serie oder früher benötigt.
game.crash.reason.macos_failed_to_find_service_port_for_display=Das Spiel kann nicht fortgesetzt werden, da das OpenGL-Fenster auf der Apple-Silicon-Plattform nicht initialisiert werden konnte.\n\
   \n\
   Für dieses Problem hat HMCL derzeit keine direkten Lösungen. Bitte versuchen Sie, einen beliebigen Browser zu öffnen und in den Vollbildmodus zu wechseln, kehren Sie dann zu HMCL zurück, starten Sie das Spiel und <b>kehren Sie schnell zur Browserseite zurück</b>, bevor das Spielfenster angezeigt wird, warten Sie, bis das Spielfenster angezeigt wird, und wechseln Sie dann zurück zum Spielfenster.
game.crash.reason.illegal_access_error=Das Spiel ist aufgrund von Mod(s) abgestürzt.\n\
   \n\
   Wenn Sie dies kennen: "%1$s", können Sie den Mod (die Mods) aktualisieren oder löschen und es dann erneut versuchen.
game.crash.reason.install_mixinbootstrap=Das Spiel ist aufgrund des fehlenden MixinBootstrap abgestürzt.\n\
   \n\
   Sie können versuchen, <a href="https://www.curseforge.com/minecraft/mc-mods/mixinbootstrap">MixinBootstrap</a> zu installieren, um das Problem zu beheben. Wenn es nach der Installation abstürzt, versuchen Sie, ein Ausrufezeichen (!) vor den Dateinamen dieses Mods zu setzen, um das Problem zu beheben.
game.crash.reason.optifine_is_not_compatible_with_forge=Das Spiel ist abgestürzt, weil OptiFine nicht mit der aktuellen Forge-Installation kompatibel ist.\n\
   \n\
   Bitte navigieren Sie zur <a href="https://optifine.net/downloads">offiziellen Website von OptiFine</a>, überprüfen Sie, ob die Forge-Version mit OptiFine kompatibel ist, und installieren Sie die Instanz unter strikter Einhaltung der entsprechenden Version neu oder ändern Sie die OptiFine-Version unter "Instanz bearbeiten → Loader".\n\
   \n\
   Nach Tests glauben wir, dass zu hohe oder zu niedrige OptiFine-Versionen Abstürze verursachen können.
game.crash.reason.mod_files_are_decompressed=Das Spiel ist abgestürzt, weil die Mod-Datei entpackt wurde.\n\
   \n\
   Bitte legen Sie die gesamte Mod-Datei direkt in das Mod-Verzeichnis!\n\
   \n\
   Wenn das Extrahieren Fehler im Spiel verursacht, löschen Sie bitte den extrahierten Mod im Mod-Verzeichnis und starten Sie das Spiel dann.
game.crash.reason.shaders_mod=Das Spiel ist abgestürzt, weil sowohl OptiFine als auch der Shaders-Mod gleichzeitig installiert sind.\n\
   \n\
   Entfernen Sie einfach den Shader-Mod, da OptiFine integrierte Unterstützung für Shader hat.
game.crash.reason.rtss_forest_sodium=Das Spiel ist abgestürzt, weil der RivaTuner Statistical Server (RTSS) nicht mit Sodium kompatibel ist.\n\
   \n\
   Klicken Sie <a href="https://github.com/CaffeineMC/sodium-fabric/wiki/Known-Issues#rtss-incompatible">hier</a> für weitere Details.
game.crash.reason.too_many_mods_lead_to_exceeding_the_id_limit=Das Spiel ist abgestürzt, weil Sie zu viele Mods installiert und das Spiel-ID-Limit überschritten haben.\n\
   \n\
   Bitte versuchen Sie, <a href="https://www.curseforge.com/minecraft/mc-mods/jeid">JEID</a> zu installieren oder einige große Mods zu löschen.
game.crash.reason.night_config_fixes=Das Spiel ist aufgrund einiger Probleme mit Night Config abgestürzt.\n\
   \n\
   Sie können versuchen, den Mod <a href="https://www.curseforge.com/minecraft/mc-mods/night-config-fixes">Night Config Fixes</a> zu installieren, der Ihnen bei diesem Problem helfen kann.\n\
   \n\
   Weitere Informationen finden Sie im <a href="https://github.com/Fuzss/nightconfigfixes">GitHub-Repository</a> dieses Mods.
game.crash.reason.optifine_causes_the_world_to_fail_to_load=Das Spiel kann aufgrund von OptiFine möglicherweise nicht weiter ausgeführt werden.\n\
   \n\
   Dieses Problem tritt nur in einer bestimmten OptiFine-Version auf. Sie können versuchen, die OptiFine-Version unter "Instanz bearbeiten → Loader" zu ändern.
game.crash.reason.jdk_9=Das Spiel ist abgestürzt, weil die Java-Version für diese Instanz zu neu ist.\n\
   \n\
   Sie müssen Java 8 herunterladen und installieren und es unter "Allgemeine/Instanzspezifische Einstellungen → Java" auswählen.
game.crash.reason.jvm_32bit=Das Spiel ist abgestürzt, weil die aktuelle Speicherzuweisung das 32-Bit-JVM-Limit überschritten hat.\n\
   \n\
   Wenn Ihr Betriebssystem 64-Bit ist, installieren und verwenden Sie bitte eine 64-Bit-Java-Version. Andernfalls müssen Sie möglicherweise ein 64-Bit-Betriebssystem neu installieren oder einen moderneren Computer erwerben.\n\
   \n\
   Oder Sie können die Option "Automatisch zuweisen" unter "Allgemeine/Instanzspezifische Einstellungen → Speicher" deaktivieren und die maximale Speicherzuweisungsgröße auf 1024 MiB oder darunter festlegen.
game.crash.reason.loading_crashed_forge=Das Spiel ist aufgrund des Mods "%1$s" (%2$s) abgestürzt.\n\
   \n\
   Sie können versuchen, ihn zu löschen oder zu aktualisieren.
game.crash.reason.loading_crashed_fabric=Das Spiel ist aufgrund des Mods "%1$s" abgestürzt.\n\
   \n\
   Sie können versuchen, ihn zu löschen oder zu aktualisieren.
game.crash.reason.mac_jdk_8u261=Das Spiel ist abgestürzt, weil Ihre aktuelle Forge- oder OptiFine-Version nicht mit Ihrer Java-Installation kompatibel ist.\n\
   \n\
   Bitte versuchen Sie, Forge und OptiFine zu aktualisieren, oder versuchen Sie, Java 8u251 oder frühere Versionen zu verwenden.
game.crash.reason.forge_repeat_installation=Das Spiel ist aufgrund einer doppelten Forge-Installation abgestürzt. <a href="https://github.com/HMCL-dev/HMCL/issues/1880">Dies ist ein bekanntes Problem</a>\n\
   \n\
   Es wird empfohlen, Feedback auf GitHub zusammen mit diesem Protokoll zu übermitteln, damit wir weitere Hinweise finden und das Problem beheben können.\n\
   \n\
   Derzeit können Sie Forge deinstallieren und es unter "Instanz bearbeiten → Loader" neu installieren.
game.crash.reason.optifine_repeat_installation=Das Spiel ist aufgrund einer doppelten OptiFine-Installation abgestürzt.\n\
   \n\
   Bitte löschen Sie OptiFine im Mod-Verzeichnis oder deinstallieren Sie es unter "Instanz bearbeiten → Loader".
game.crash.reason.memory_exceeded=Das Spiel ist abgestürzt, weil zu viel Speicher für eine kleine Auslagerungsdatei zugewiesen wurde.\n\
   \n\
   Sie können versuchen, die Option "Automatisch zuweisen" unter "Allgemeine/Instanzspezifische Einstellungen → Speicher" zu deaktivieren und den Wert anzupassen, bis das Spiel startet.\n\
   \n\
   Sie können auch versuchen, die Größe der Auslagerungsdatei in den Systemeinstellungen zu erhöhen.
game.crash.reason.mod=Das Spiel ist aufgrund des Mods "%1$s" abgestürzt.\n\
   \n\
   Sie können den Mod aktualisieren oder löschen und es dann erneut versuchen.
game.crash.reason.mod_resolution=Das Spiel kann aufgrund von Mod-Abhängigkeitsproblemen nicht weiter ausgeführt werden.\n\
   \n\
   Fabric hat folgende Details bereitgestellt:\n\
   \n\
   %1$s
game.crash.reason.forgemod_resolution=Das Spiel kann aufgrund von Mod-Abhängigkeitsproblemen nicht weiter ausgeführt werden.\n\
   \n\
   Forge/NeoForge hat folgende Details bereitgestellt:\n\
   %1$s
game.crash.reason.forge_found_duplicate_mods=Das Spiel ist aufgrund eines Problems mit doppelten Mods abgestürzt. Forge/NeoForge hat folgende Informationen bereitgestellt:\n\
   %1$s
game.crash.reason.mod_resolution_collection=Das Spiel ist abgestürzt, weil die Mod-Version nicht kompatibel ist.\n\
   \n\
   "%1$s" benötigt den Mod "%2$s".\n\
   \n\
   Sie müssen "%3$s" aktualisieren oder herunterstufen, bevor Sie fortfahren.
game.crash.reason.mod_resolution_conflict=Das Spiel ist aufgrund von inkompatiblen Mods abgestürzt.\n\
   \n\
   "%1$s" ist nicht kompatibel mit "%2$s".
game.crash.reason.mod_resolution_missing=Das Spiel ist abgestürzt, weil einige abhängige Mods nicht installiert waren.\n\
   \n\
   "%1$s" benötigt den Mod "%2$s".\n\
   \n\
   Dies bedeutet, dass Sie "%2$s" zuerst herunterladen und installieren müssen, um weiterzuspielen.
game.crash.reason.mod_resolution_missing_minecraft=Das Spiel ist abgestürzt, weil ein Mod nicht mit der aktuellen Minecraft-Version kompatibel ist.\n\
   \n\
   "%1$s" benötigt die Minecraft-Version %2$s.\n\
   \n\
   Wenn Sie mit dieser installierten Mod-Version spielen möchten, sollten Sie die Spielversion Ihrer Instanz ändern.\n\
   \n\
   Andernfalls sollten Sie eine Version installieren, die mit dieser Minecraft-Version kompatibel ist.
game.crash.reason.mod_resolution_mod_version=%1$s (Version: %2$s)
game.crash.reason.mod_resolution_mod_version.any=%1$s (Jede Version)
game.crash.reason.modlauncher_8=Das Spiel ist abgestürzt, weil Ihre aktuelle Forge-Version nicht mit Ihrer Java-Installation kompatibel ist. Bitte versuchen Sie, Forge zu aktualisieren.
game.crash.reason.no_class_def_found_error=Das Spiel kann aufgrund von unvollständigem Code nicht weiter ausgeführt werden.\n\
   \n\
   Ihrer Spielinstanz fehlt "%1$s". Dies könnte daran liegen, dass ein Mod fehlt, ein inkompatibler Mod installiert ist oder einige Dateien beschädigt sind.\n\
   \n\
   Sie müssen möglicherweise das Spiel und alle Mods neu installieren oder jemanden um Hilfe bitten.
game.crash.reason.no_such_method_error=Das Spiel kann aufgrund von unvollständigem Code nicht weiter ausgeführt werden.\n\
   \n\
   Ihrer Spielinstanz fehlt möglicherweise ein Mod, sie hat einen inkompatiblen Mod installiert oder einige Dateien sind möglicherweise beschädigt.\n\
   \n\
   Sie müssen möglicherweise das Spiel und alle Mods neu installieren oder jemanden um Hilfe bitten.
game.crash.reason.opengl_not_supported=Das Spiel ist abgestürzt, weil Ihr Grafiktreiber OpenGL nicht unterstützt.\n\
   \n\
   Wenn Sie das Spiel über das Internet streamen oder eine Remotedesktopumgebung verwenden, spielen Sie das Spiel bitte auf Ihrem lokalen Computer.\n\
   \n\
   Oder Sie können Ihren Grafiktreiber auf die neueste Version aktualisieren und es dann erneut versuchen.\n\
   \n\
   Wenn Ihr Computer über eine dedizierte Grafikkarte verfügt, stellen Sie bitte sicher, dass das Spiel diese tatsächlich zum Rendern verwendet. Wenn das Problem weiterhin besteht, ziehen Sie bitte eine neue Grafikkarte oder einen neuen Computer in Betracht.
game.crash.reason.openj9=Das Spiel kann nicht auf einer OpenJ9-JVM ausgeführt werden. Bitte wechseln Sie unter "Allgemeine/Instanzspezifische Einstellungen → Java" zu einem Java, das die Hotspot-JVM verwendet, und starten Sie das Spiel neu. Wenn Sie keines haben, können Sie eines herunterladen.
game.crash.reason.out_of_memory=Das Spiel ist abgestürzt, weil dem Computer der Speicher ausgegangen ist.\n\
   \n\
   Möglicherweise ist nicht genügend Speicher verfügbar oder es sind zu viele Mods installiert. Sie können versuchen, dies zu beheben, indem Sie den zugewiesenen Speicher unter "Allgemeine/Instanzspezifische Einstellungen → Speicher" erhöhen.\n\
   \n\
   Wenn Sie immer noch auf diese Probleme stoßen, benötigen Sie möglicherweise einen besseren Computer.
game.crash.reason.resolution_too_high=Das Spiel ist abgestürzt, weil die Auflösung des Ressourcen-/Texturpakets zu hoch ist.\n\
   \n\
   Sie sollten zu einem Ressourcen-/Texturpaket mit niedrigerer Auflösung wechseln oder den Kauf einer besseren Grafikkarte mit mehr VRAM in Betracht ziehen.
game.crash.reason.stacktrace=Die Absturzursache ist unbekannt. Sie können Details anzeigen, indem Sie auf "Protokolle" klicken.\n\
   \n\
   Es gibt einige Schlüsselwörter, die einige Mod-Namen enthalten könnten. Sie können diese online suchen, um das Problem selbst herauszufinden.\n\
   \n\
   %s
game.crash.reason.too_old_java=Das Spiel ist abgestürzt, weil Sie eine veraltete Java-Version verwenden.\n\
   \n\
   Sie müssen unter "Allgemeine/Instanzspezifische Einstellungen → Java" zu einer neueren Java-Version (%1$s) wechseln und das Spiel dann neu starten. Sie können Java <a href="https://learn.microsoft.com/java/openjdk/download">hier</a> herunterladen.
game.crash.reason.unknown=Wir können nicht herausfinden, warum das Spiel abgestürzt ist. Bitte beachten Sie die Spielprotokolle.
game.crash.reason.unsatisfied_link_error=Fehler beim Starten von Minecraft aufgrund fehlender Bibliotheken: %1$s.\n\
   \n\
   Wenn Sie den nativen Bibliothekspfad bearbeitet haben, stellen Sie bitte sicher, dass diese Bibliotheken tatsächlich vorhanden sind. Andernfalls versuchen Sie bitte, nach dem Zurücksetzen auf die Standardwerte erneut zu starten.\n\
   \n\
   Wenn Sie dies nicht getan haben, überprüfen Sie bitte, ob Ihnen Abhängigkeits-Mods fehlen.\n\
   \n\
   Andernfalls, wenn Sie glauben, dass dies durch HMCL verursacht wird, geben Sie uns bitte Feedback.
