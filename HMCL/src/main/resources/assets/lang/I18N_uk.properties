launch.advice.cleanroom=Cleanroom %2$s можна запускати лише на Java %1$s або новішій. Використовуйте Java %1$s або новішу версію.
launch.advice.uncorrected=Якщо ви все ще хочете використовувати свій вибір версії Java, ви можете вимкнути "Не перевіряти сумісність JVM" у "Глобальні/Специфічні налаштування екземпляра → Розширені налаштування".
launch.advice.different_platform=Для вашого пристрою рекомендується 64-бітна версія Java, але ви встановили 32-бітну.
launch.advice.forge2760_liteloader=Forge версії 2760 несумісний з LiteLoader. Розгляньте можливість оновлення Forge до версії 2773 або новішої.
launch.advice.forge28_2_2_optifine=Forge версії 28.2.2 або новішої несумісний з OptiFine. Розгляньте можливість пониження Forge до версії 28.2.1 або ранішої.
launch.advice.forge37_0_60=Forge версій до 37.0.60 несумісний з Java 17. Оновіть Forge до 37.0.60 або новішої, або запустіть гру з Java 16.
launch.advice.java8_51_1_13=Minecraft 1.13 може зазнати збою на версіях Java 8 до 1.8.0_51. Встановіть останню версію Java 8.
launch.advice.java9=Ви не можете запустити Minecraft 1.12 або раніші з Java 9 або новішою. Використовуйте Java 8.
launch.advice.modded_java=Деякі моди можуть бути несумісні з новішими версіями Java. Рекомендується використовувати Java %s для запуску Minecraft %s.
launch.advice.modlauncher8=Версія Forge, яку ви використовуєте, несумісна з поточною версією Java. Спробуйте оновити Forge.
launch.advice.newer_java=Ви використовуєте старішу версію Java для запуску гри. Рекомендується оновити до Java 8, інакше деякі моди можуть призвести до збою гри.
launch.advice.not_enough_space=Ви виділили розмір пам'яті, більший за фактичні %d МіБ пам'яті, встановленої на вашому комп'ютері. Ви можете зіткнутися з погіршеною продуктивністю або навіть не зможете запустити гру.
launch.advice.require_newer_java_version=Поточна версія гри вимагає Java %s, але ми не змогли знайти її. Бажаєте завантажити її зараз?
launch.advice.too_large_memory_for_32bit=Ви виділили розмір пам'яті, більший за обмеження пам'яті 32-бітної інсталяції Java. Ви можете не змогти запустити гру.
launch.advice.vanilla_linux_java_8=Minecraft 1.12.2 або раніші підтримують лише Java 8 для платформи Linux x86-64, оскільки новіші версії не можуть завантажити 32-бітні нативні бібліотеки, такі як liblwjgl.so. Завантажте її з java.com або встановіть OpenJDK 8.
launch.advice.vanilla_x86.translation=Minecraft не повністю підтримується на вашій платформі, тому ви можете зіткнутися з відсутністю функцій або навіть не зможете запустити гру. Ви можете завантажити Java для архітектури <b>x86-64</b> <a href="https://learn.microsoft.com/java/openjdk/download">тут</a> для повного ігрового досвіду.
# launch.advice.lwjgl_3_4_1=Поточна версія гри має відому проблему, яка може спричинити підвисання у грі.\nHMCL може автоматично оптимізувати продуктивність гри (використовуючи Java Agent).\nЧи дозволяєте ви HMCL автоматично оптимізувати гру?\nЯкщо у вас виникнуть проблеми, ви можете вимкнути опцію "Дозволити HMCL змінювати гру" у "Налаштування → Загальні".
