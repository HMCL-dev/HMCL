launch.advice.java.auto=Поточна версія Java несумісна з екземпляром. Натисніть "Так", щоб автоматично вибрати найбільш сумісну версію Java. Або ви можете перейти до "Глобальні/Специфічні налаштування екземпляра → Java", щоб вибрати її самостійно.
