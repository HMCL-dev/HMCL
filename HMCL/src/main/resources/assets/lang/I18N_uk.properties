terracotta.status.uninitialized.desc=Ви юридично зобов'язуєтесь суворо дотримуватися всіх законів і правил вашої країни або регіону під час мережевої гри.
terracotta.confirm.title=Повідомлення для користувача
terracotta.confirm.desc=Terracotta - це стороннє безкоштовне програмне забезпечення з відкритим вихідним кодом. Будь ласка, залишайте відгуки про будь-які проблеми, з якими ви стикаєтеся під час використання, через відповідні канали.\n\  Terracotta використовує технологію P2P. Після успішного підключення користувачі в кімнаті підключатимуться безпосередньо один до одного, і жоден сторонній сервер не буде ретранслювати ваш трафік. Кінцевий досвід мережевої гри значною мірою залежить від стану мережі учасників.\n\  Протягом усього процесу мережевої гри ви повинні суворо дотримуватися всіх законів і правил вашої країни та регіону.
