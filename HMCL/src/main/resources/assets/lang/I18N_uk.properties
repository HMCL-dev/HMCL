game.crash.feedback=<b>Будь ласка, не діліться скріншотами або фотографіями цього інтерфейсу з іншими!</b> Якщо ви просите допомоги в інших, натисніть <b>"Експортувати журнали збоїв"</b> і надішліть експортований файл іншим для аналізу.
game.crash.info=Інформація про збій
game.crash.reason=Причина збою
game.crash.reason.analyzing=Аналіз...
game.crash.reason.multiple=Виявлено кілька причин:\n\n
game.crash.reason.block=Гра завершила роботу через блок у світі.\n\
  \n\
  Ви можете спробувати видалити цей блок за допомогою <a href="https://minecraft.wiki/w/Tutorial:Programs_and_editors/Mapping#Map_editors">редакторів карт</a> або видаливши мод, який його додав.\n\
  \n\
  Тип блоку: %1$s\n\
  Місцезнаходження: %2$s
game.crash.reason.bootstrap_failed=Гра зазнала збою через мод "%1$s". \n\
   \n\
   Ви можете спробувати видалити або оновити його.
game.crash.reason.config=Гра зазнала збою, оскільки мод "%1$s" не зміг розібрати свій файл конфігурації "%2$s".
game.crash.reason.debug_crash=Гра зазнала збою, оскільки ви викликали її вручну. Тож ви, ймовірно, знаєте, чому :)
game.crash.reason.duplicated_mod=Гра не може продовжувати роботу через дублікати модів "%1$s". \n\
   %2$s \n\
   Кожен мод можна встановити лише один раз. Видаліть дублікат мода та спробуйте знову.
game.crash.reason.entity=Гра завершила роботу через сутність у світі.\n\
  \n\
  Ви можете спробувати видалити сутність за допомогою <a href="https://minecraft.wiki/w/Tutorial:Programs_and_editors/Mapping#Map_editors">редакторів карт</a> або видаливши мод, який її додав.\n\
  \n\
  Тип сутності: %1$s\n\
  Місцезнаходження: %2$s
game.crash.reason.modmixin_failure=Гра зазнала збою, оскільки деякі моди не вдалося ввести. \n\
   Це, як правило, означає, що мод має помилку або несумісний з поточним середовищем. \n\
   Ви можете перевірити журнал, щоб знайти помилковий мод.
game.crash.reason.forge_error=Forge/NeoForge може надати інформацію про помилку. \n\
   Ви можете переглянути журнал та відповідно обробити його відповідно до інформації про помилку в звіті. \n\
   Якщо ви не бачите повідомлення про помилку, ви можете переглянути звіт про помилку, щоб зрозуміти, як сталася помилка. \n\
   %1$s
game.crash.reason.mod_resolution0=Гра зазнала збою через проблеми з модами. Ви можете перевірити журнали, щоб знайти помилкові моди.
game.crash.reason.mixin_apply_mod_failed=Гра зазнала збою, оскільки міксин не вдалося застосувати до мода "%1$s". \n\
   Ви можете спробувати видалити або оновити мод для вирішення проблеми.
game.crash.reason.java_version_is_too_high=Гра зазнала збою, оскільки версія Java занадто нова для продовження роботи. \n\
   Використовуйте попередню основну версію Java у "Глобальні/Специфічні налаштування екземпляра → Java", а потім запустіть гру. \n\
   Якщо ні, ви можете завантажити його з <a href="https://www.java.com/download/">java.com (Java 8)</a> або <a href="https://bell-sw.com/pages/downloads/#downloads">BellSoft Liberica Full JRE (Java 17)</a> та інших дистрибутивів для завантаження та встановлення (перезапустіть лаунчер після встановлення).
game.crash.reason.need_jdk11=Гра зазнала збою через неприйнятну версію Java. \n\
   Вам потрібно завантажити та встановити Java 11 та встановити її у "Глобальні/Специфічні налаштування екземпляра → Java".
game.crash.reason.mod_name=Гра зазнала збою через проблеми з іменем файлу мода. \n\
   Імена файлів модів повинні використовувати лише англійські літери (A~Z, a~z), цифри (0~9), дефіси (-), підкреслення (_) та крапки (.) у половинному розмірі. \n\
   Перейдіть до каталогу модів і змініть усі несумісні імена файлів модів, використовуючи сумісні символи вище.
game.crash.reason.incomplete_forge_installation=Гра не може продовжувати роботу через неповне встановлення Forge/NeoForge. \n\
   Перевстановіть Forge/NeoForge у "Редагувати екземпляр → Завантажувачі".
game.crash.reason.fabric_version_0_12=Завантажувач Fabric 0.12 або новіший несумісний з поточними встановленими модами. Вам потрібно понизити його до 0.11.7.
game.crash.reason.fabric_warnings=Завантажувач Fabric попередив: \n\
   %1$s
game.crash.reason.file_already_exists=Гра зазнала збою, оскільки файл "%1$s" вже існує. \n\
   Ви можете спробувати створити резервну копію та видалити цей файл, а потім знову запустити гру.
game.crash.reason.file_changed=Гра зазнала збою через невдалу перевірку файлу. \n\
   Якщо ви змінили файл Minecraft.jar, вам потрібно скасувати зміну або повторно завантажити гру.
game.crash.reason.gl_operation_failure=Гра зазнала збою через деякі моди, шейдери або пакети ресурсів/текстур. \n\
   Вимкніть моди, шейдери або пакети ресурсів/текстур, які ви використовуєте, а потім спробуйте знову.
game.crash.reason.graphics_driver=Гра зазнала збою через проблему з вашим графічним драйвером. \n\
   Спробуйте знову після оновлення вашого графічного драйвера до останньої версії. \n\
   Якщо у вашого комп'ютера є виділена графічна карта, вам потрібно перевірити, чи використовує гра інтегровану/основну графіку. Якщо так, відкрийте лаунчер, використовуючи вашу виділену графічну карту. Якщо проблема не зникає, вам, ймовірно, слід подумати про придбання нової графічної карти або нового комп'ютера. \n\
   Якщо ви використовуєте інтегровану графічну карту, зверніть увагу, що Minecraft 1.16.5 або раніше вимагає <a href="https://www.oracle.com/java/technologies/javase/javase8-archive-downloads.html">Java 1.8.0_51 або раніше</a> для процесора Intel(R) Core(TM) 3000 серії або раніше.
game.crash.reason.macos_failed_to_find_service_port_for_display=Гра не може продовжувати роботу, оскільки вікно OpenGL на платформі Apple silicon не вдалося ініціалізувати. \n\
   Для цієї проблеми HMCL наразі не має прямих рішень. Спробуйте відкрити будь-який браузер та перейти в повноекранний режим, потім поверніться до HMCL, запустіть гру та <b>швидко поверніться на сторінку браузера</b> перед тим, як з'явиться вікно гри, зачекайте, поки з'явиться вікно гри, а потім переключіться назад на вікно гри.
game.crash.reason.illegal_access_error=Гра зазнала збою через деякі моди. \n\
   Якщо ви знаєте це: "%1$s", ви можете оновити або видалити моди та спробувати знову.
game.crash.reason.install_mixinbootstrap=Гра зазнала збою через відсутність MixinBootstrap. \n\
   Ви можете спробувати встановити <a href="https://www.curseforge.com/minecraft/mc-mods/mixinbootstrap">MixinBootstrap</a> для вирішення проблеми. Якщо вона зазнає збою після встановлення, спробуйте додати знак оклику (!) перед ім'ям файлу цього мода, щоб спробувати вирішити проблему.
game.crash.reason.optifine_is_not_compatible_with_forge=Гра зазнала збою, оскільки OptiFine несумісний з поточним встановленням Forge. \n\
   Перейдіть на <a href="https://optifine.net/downloads">офіційний сайт OptiFine</a>, перевірте, чи версія Forge сумісна з OptiFine, і перевстановіть екземпляр строго відповідно до відповідної версії, або змініть версію OptiFine у "Редагувати екземпляр → Завантажувачі". \n\
   Після тестування ми вважаємо, що занадто високі або занадто низькі версії OptiFine можуть призвести до збоїв.
game.crash.reason.mod_files_are_decompressed=Гра зазнала збою, оскільки файл мода було розпаковано. \n\
   Помістіть весь файл мода безпосередньо в каталог модів! \n\
   Якщо розпакування викликає помилки в грі, видаліть розпакований мод у каталозі модів та запустіть гру.
game.crash.reason.shaders_mod=Гра зазнала збою, оскільки OptiFine та Shaders mod встановлені одночасно.\n\
   Просто видаліть мод Shader, оскільки OptiFine має вбудовану підтримку шейдерів.
game.crash.reason.rtss_forest_sodium=Гра зазнала збою, оскільки RivaTuner Statistical Server (RTSS) несумісний з Sodium.\n\
   Натисніть <a href="https://github.com/CaffeineMC/sodium-fabric/wiki/Known-Issues#rtss-incompatible">тут</a> для отримання додаткової інформації.
game.crash.reason.too_many_mods_lead_to_exceeding_the_id_limit=Гра зазнала збою, оскільки ви встановили занадто багато модів і перевищили ліміт ID гри.\n\
   Спробуйте встановити <a href="https://www.curseforge.com/minecraft/mc-mods/jeid">JEID</a> або видалити деякі великі моди.
game.crash.reason.night_config_fixes=Гра зазнала збою через деякі проблеми з Night Config.\n\
   \n\
   Ви можете спробувати встановити мод <a href="https://www.curseforge.com/minecraft/mc-mods/night-config-fixes">Night Config Fixes</a>, який може допомогти вам з цією проблемою.\n\
   \n\
   Для отримання додаткової інформації відвідайте <a href="https://github.com/Fuzss/nightconfigfixes">репозиторій GitHub</a> цього мода.
game.crash.reason.optifine_causes_the_world_to_fail_to_load=Гра може не продовжувати роботу через OptiFine.\n\
   \n\
   Ця проблема виникає лише в певній версії OptiFine. Ви можете спробувати змінити версію OptiFine у "Редагувати екземпляр → Завантажувачі".
game.crash.reason.jdk_9=Гра зазнала збою, оскільки версія Java занадто нова для цього екземпляра.\n\
   \n\
   Вам потрібно завантажити та встановити Java 8 та вибрати її у "Глобальні/Специфічні налаштування екземпляра → Java".
game.crash.reason.jvm_32bit=Гра зазнала збою, оскільки поточне виділення пам'яті перевищило ліміт 32-бітної JVM.\n\
   \n\
   Якщо ваша ОС 64-бітна, встановіть та використовуйте 64-бітну версію Java. Інакше вам може знадобитися перевстановити 64-бітну ОС або отримати новіший комп'ютер.\n\
   \n\
   Або ви можете вимкнути опцію "Автоматично виділяти" у "Глобальні/Специфічні налаштування екземпляра → Пам'ять" та встановити максимальний розмір виділення пам'яті до 1024 МіБ або менше.
game.crash.reason.loading_crashed_forge=Гра зазнала збою через мод "%1$s" (%2$s).\n\
   \n\
   Ви можете спробувати видалити або оновити його.
game.crash.reason.loading_crashed_fabric=Гра зазнала збою через мод "%1$s".\n\
   \n\
   Ви можете спробувати видалити або оновити його.
game.crash.reason.mac_jdk_8u261=Гра зазнала збою, оскільки ваша поточна версія Forge або OptiFine несумісна з вашою інсталяцією Java.\n\
   \n\
   Спробуйте оновити Forge та OptiFine або спробуйте використовувати Java 8u251 або попередні версії.
game.crash.reason.forge_repeat_installation=Гра зазнала збою через дублікат встановлення Forge. <a href="https://github.com/HMCL-dev/HMCL/issues/1880">Це відома проблема</a>\n\
   \n\
   Рекомендується надіслати відгук на GitHub разом із цим журналом, щоб ми могли знайти більше підказок та вирішити проблему.\n\
   \n\
   Наразі ви можете видалити Forge та перевстановити його у "Редагувати екземпляр → Завантажувачі".
game.crash.reason.optifine_repeat_installation=Гра зазнала збою через дублікат встановлення OptiFine.\n\
   \n\
   Видаліть OptiFine у каталозі модів або видаліть його у "Редагувати екземпляр → Завантажувачі".
game.crash.reason.memory_exceeded=Гра зазнала збою, оскільки занадто багато пам'яті було виділено для малого файлу сторінки.\n\
   \n\
   Ви можете спробувати вимкнути опцію "Автоматично виділяти" у "Глобальні/Специфічні налаштування екземпляра → Пам'ять" та налаштувати значення до запуску гри.\n\
   \n\
   Ви також можете спробувати збільшити розмір файлу сторінки в налаштуваннях системи.
game.crash.reason.mod=Гра зазнала збою через мод "%1$s".\n\
   \n\
   Ви можете оновити або видалити мод та спробувати знову.
game.crash.reason.mod_resolution=Гра не може продовжувати роботу через проблеми з залежностями модів.\n\
   \n\
   Fabric надав наступні деталі: \n\
   \n\
   %1$s
game.crash.reason.forgemod_resolution=Гра не може продовжувати роботу через проблеми з залежностями модів.\n\
   \n\
   Forge/NeoForge надав наступні деталі: \n\
   %1$s
game.crash.reason.forge_found_duplicate_mods=Гра зазнала збою через проблему з дублікатами модів. Forge/NeoForge надав наступну інформацію:\n\
   %1$s
game.crash.reason.mod_resolution_collection=Гра зазнала збою, оскільки версія мода несумісна.\n\
   \n\
   "%1$s" вимагає мод "%2$s".\n\
   \n\
   Вам потрібно оновити або понизити "%3$s" перед продовженням.
game.crash.reason.mod_resolution_conflict=Гра зазнала збою через конфліктуючі моди.\n\
   \n\
   "%1$s" несумісний з "%2$s".
game.crash.reason.mod_resolution_missing=Гра зазнала збою, оскільки деякі залежні моди не були встановлені.\n\
   \n\
   "%1$s" вимагає мод "%2$s".\n\
   \n\
   Це означає, що вам потрібно завантажити та встановити "%2$s" для продовження гри.
game.crash.reason.mod_resolution_missing_minecraft=Гра зазнала збою, оскільки мод несумісний з поточною версією Minecraft.\n\
   \n\
   "%1$s" вимагає версію Minecraft %2$s.\n\
   \n\
   Якщо ви хочете грати з цією версією мода, вам слід змінити версію гри вашого екземпляра.\n\
   \n\
   Інакше вам слід встановити версію, сумісну з цією версією Minecraft.
game.crash.reason.mod_resolution_mod_version=%1$s (Версія: %2$s)
game.crash.reason.mod_resolution_mod_version.any=%1$s (Будь-яка версія)
game.crash.reason.modlauncher_8=Гра зазнала збою, оскільки ваша поточна версія Forge несумісна з вашою інсталяцією Java. Спробуйте оновити Forge.
game.crash.reason.no_class_def_found_error=Гра не може продовжувати роботу через неповний код.\n\
   \n\
   У вашому екземплярі гри відсутній "%1$s". Це може бути через те, що мод відсутній, встановлений несумісний мод або деякі файли пошкоджені.\n\
   \n\
   Можливо, вам потрібно перевстановити гру та всі моди або попросити когось про допомогу.
game.crash.reason.no_such_method_error=Гра не може продовжувати роботу через неповний код.\n\
   \n\
   У вашому екземплярі гри може бути відсутній мод, встановлений несумісний мод або деякі файли можуть бути пошкоджені.\n\
   \n\
   Можливо, вам потрібно перевстановити гру та всі моди або попросити когось про допомогу.
game.crash.reason.opengl_not_supported=Гра зазнала збою, оскільки ваш графічний драйвер не підтримує OpenGL.\n\
   \n\
   Якщо ви транслюєте гру через Інтернет або використовуєте середовище віддаленого робочого столу, будь ласка, грайте на вашому локальному комп'ютері.\n\
   \n\
   Або ви можете оновити ваш графічний драйвер до останньої версії та спробувати знову.\n\
   \n\
   Якщо у вашого комп'ютера є виділена графічна карта, переконайтеся, що гра дійсно використовує її для рендерингу. Якщо проблема не зникає, подумайте про придбання нової графічної карти або нового комп'ютера.
game.crash.reason.openj9=Гра не може працювати на JVM OpenJ9. Переключіться на Java, яка використовує JVM Hotspot у "Глобальні/Специфічні налаштування екземпляра → Java" та знову запустіть гру. Якщо у вас її немає, ви можете завантажити її.
game.crash.reason.out_of_memory=Гра зазнала збою, оскільки комп'ютер закінчився пам'ять.\n\
   \n\
   Можливо, недостатньо доступної пам'яті або встановлено занадто багато модів. Ви можете спробувати вирішити це, збільшивши виділену пам'ять у "Глобальні/Специфічні налаштування екземпляра → Пам'ять".\n\
   \n\
   Якщо ви все ще зіткнетеся з цими проблемами, вам може знадобитися кращий комп'ютер.
game.crash.reason.resolution_too_high=Гра зазнала збою, оскільки роздільна здатність пакета ресурсів/текстур занадто висока.\n\
   \n\
   Ви повинні переключитися на пакет ресурсів/текстур з нижчою роздільною здатністю або подумати про придбання кращої графічної карти з більшим обсягом VRAM.
game.crash.reason.stacktrace=Причина збою невідома. Ви можете переглянути її деталі, натиснувши "Журнали".\n\
   \n\
   Є деякі ключові слова, які можуть містити деякі імена модів. Ви можете пошукати їх в Інтернеті, щоб з'ясувати проблему самостійно.\n\
   \n\
   %s
game.crash.reason.too_old_java=Гра зазнала збою, оскільки ви використовуєте застарілу версію Java.\n\
   \n\
   Вам потрібно переключитися на новішу версію Java (%1$s) у "Глобальні/Специфічні налаштування екземпляра → Java" та знову запустити гру. Ви можете завантажити Java <a href="https://learn.microsoft.com/java/openjdk/download">тут</a>.
game.crash.reason.unknown=Ми не можемо з'ясувати, чому гра зазнала збою. Зверніться до журналів гри.
game.crash.reason.unsatisfied_link_error=Не вдалося запустити Minecraft через відсутність бібліотек: %1$s. \n\
   Якщо ви редагували шлях до нативних бібліотек, переконайтеся, що ці бібліотеки дійсно існують. Або спробуйте запустити знову після повернення до типового значення. \n\
   Якщо ви цього не робили, перевірте, чи не відсутні у вас залежні моди. \n\
   Інакше, якщо ви вважаєте, що це спричинено HMCL, надайте нам відгук.
