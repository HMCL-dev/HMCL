name: Java CI

on:
  push:
  pull_request:
    paths-ignore:
      - '**.md'

env:
  JAVA_COMPATIBILITY: '17'

jobs:
  build:

    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        java: [${{ env.JAVA_COMPATIBILITY }}, '25', '27']

    runs-on: ${{ matrix.os }}

    env:
      ADDITIONAL_CLASSIFIER: ${{ matrix.os }}-JDK${{ matrix.java }}

    steps:
    - uses: actions/checkout@v6
    - name: Set up JDK
      uses: actions/setup-java@v6
      with:
        distribution: 'liberica'
        java-version: ${{ matrix.java }}
        java-package: 'jdk+fx'
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5
      with:
        cache-cleanup: never
        cache-read-only: ${{ matrix.java != env.JAVA_COMPATIBILITY || github.event.repository != null && github.ref_name != github.event.repository.default_branch }}
    - name: Build with Gradle on Ubuntu
      if: runner.os == 'Linux'
      run: xvfb-run --auto-servernum ./gradlew build --no-daemon --parallel --stacktrace
      env:
        JAVA_TOOL_OPTIONS: -Djava.awt.headless=true
        MICROSOFT_AUTH_ID: ${{ secrets.MICROSOFT_AUTH_ID }}
        CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
    - name: Build with Gradle on Windows
      if: runner.os == 'Windows'
      run: .\gradlew.bat build --no-daemon --parallel --stacktrace
      env:
        JAVA_TOOL_OPTIONS: "-Dhmcl.native.encoding=GB18030"
        MICROSOFT_AUTH_ID: ${{ secrets.MICROSOFT_AUTH_ID }}
        CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
    - name: Build with Gradle on macOS
      if: runner.os == 'macOS'
      run: ./gradlew build --no-daemon --parallel --stacktrace
      env:
        MICROSOFT_AUTH_ID: ${{ secrets.MICROSOFT_AUTH_ID }}
        CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
    - if: always()
      name: Get short SHA
      shell: bash
      run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV
    - if: failure()
      name: Upload test report
      uses: actions/upload-artifact@v7
      with:
        name: HMCL-test-report-html-${{ env.SHORT_SHA }}-${{ env.ADDITIONAL_CLASSIFIER }}
        path: "**/build/reports/tests/test/"
    - name: Upload JAR
      if: runner.os == 'Linux' && matrix.java == env.JAVA_COMPATIBILITY
      uses: actions/upload-artifact@v7
      with:
        name: HMCL-${{ env.SHORT_SHA }}-jar
        path: HMCL/build/libs/HMCL-*.jar
        archive: false
    - name: Upload EXE
      if: runner.os == 'Linux' && matrix.java == env.JAVA_COMPATIBILITY
      uses: actions/upload-artifact@v7
      with:
        name: HMCL-${{ env.SHORT_SHA }}-exe
        path: HMCL/build/libs/HMCL-*.exe
        archive: false
    - name: Upload SH
      if: runner.os == 'Linux' && matrix.java == env.JAVA_COMPATIBILITY
      uses: actions/upload-artifact@v7
      with:
        name: HMCL-${{ env.SHORT_SHA }}-sh
        path: HMCL/build/libs/HMCL-*.sh
        archive: false
    - name: Upload DEB
      if: runner.os == 'Linux' && matrix.java == env.JAVA_COMPATIBILITY
      uses: actions/upload-artifact@v7
      with:
        name: HMCL-${{ env.SHORT_SHA }}-deb
        path: HMCL/build/libs/HMCL-*.deb
        archive: false
